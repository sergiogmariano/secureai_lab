{% extends "base.html" %}{% block title %}Painel{% endblock %}
{% block body %}
<div class="card">
  <h1>Painel do Médico (admin)</h1>
  <p><a class="btn ghost" href="{{ url_for('auditoria') }}">Ver log de auditoria assinado</a></p>
</div>
<div class="card">
  <h2>Pacientes</h2>
  <table><tr><th>ID</th><th>Nome</th><th></th></tr>
  {% for p in pats %}
    <tr><td>{{ p.id }}</td><td>{{ p.full_name }}</td>
    <td><a class="btn ghost" href="{{ url_for('paciente', pid=p.id) }}">Abrir prontuário</a></td></tr>
  {% endfor %}
  </table>
</div>
{% endblock %}
